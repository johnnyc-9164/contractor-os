name: cd

# Continuous deployment: master -> Convex production -> Vercel production.
# Triggered only by pushes to master (i.e. after CI passed and code merged).
# Serialized with concurrency so production deploys never overlap.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-convex:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: deploy backend to Convex production
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        working-directory: packages/backend
        run: npx convex deploy

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [deploy-convex]
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      # Deploy hook bypasses the Hobby "commit author" block: the deploy is
      # triggered by CI, not by a collaborator push.
      - name: trigger Vercel production deploy
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

  smoke:
    runs-on: ubuntu-latest
    needs: [deploy-vercel]
    steps:
      - name: production health check (poll until live)
        run: |
          for i in $(seq 1 30); do
            if curl -sf https://contractoros-ten.vercel.app/ > /dev/null; then
              echo "production homepage reachable (attempt $i)"
              exit 0
            fi
            echo "attempt $i: not live yet, waiting 20s..."
            sleep 20
          done
          echo "production homepage never became reachable"
          exit 1
