name: preview-verification

# This workflow certifies an existing Vercel Preview. It never creates a
# deployment and cannot target Production.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - preview
      preview_url:
        description: Exact Vercel Preview URL to verify
        required: true
        type: string
      expected_sha:
        description: Full commit SHA the Preview must report
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-verification-${{ inputs.expected_sha }}
  cancel-in-progress: true

jobs:
  verify-preview:
    name: verify exact Preview SHA and Convex health
    runs-on: ubuntu-latest
    env:
      PREVIEW_TARGET: ${{ inputs.target }}
      PREVIEW_URL: ${{ inputs.preview_url }}
      REQUESTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: bind requested SHA to the dispatched revision
        run: |
          if [ "$REQUESTED_SHA" != "$EXPECTED_SHA" ]; then
            echo "Requested SHA $REQUESTED_SHA does not match dispatched SHA $EXPECTED_SHA"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: verify requested commit is live on Preview
        run: >-
          pnpm exec tsx tooling/sprite-factory/preview-deployment.ts
          --target "$PREVIEW_TARGET"
          --preview-url "$PREVIEW_URL"
          --expected-sha "$EXPECTED_SHA"

      - name: auth routes behave for signed-out visitors
        run: |
          base="${PREVIEW_URL%/}"
          # /sign-in must render the Clerk sign-in surface ...
          for i in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base/sign-in")
            if [ "$code" = "200" ]; then
              echo "GET /sign-in -> 200 (attempt $i)"
              break
            fi
            echo "attempt $i: GET /sign-in -> $code; waiting 20s..."
            sleep 20
            if [ "$i" = "5" ]; then
              echo "FAIL: GET /sign-in never returned 200"
              exit 1
            fi
          done
          # ... while /sign-up must NOT exist: this is a private admin panel
          # with no public sign-up surface.
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/sign-up")
          if [ "$code" != "404" ]; then
            echo "FAIL: GET /sign-up -> $code, expected 404 (no public sign-up surface)"
            exit 1
          fi
          echo "GET /sign-up -> 404 (no public sign-up surface)"
          # Signed-out page navigation to /dashboard must redirect to the
          # sign-in route, never 404. (Accept: text/html makes Clerk treat this
          # as a page request, the same as a real browser navigation.)
          # NOTE: while the project runs on Clerk TEST keys, Clerk's
          # dev-browser handshake interstitial fires before the middleware's
          # own /sign-in redirect: the 307 goes to
          # <instance>.clerk.accounts.dev/v1/client/handshake with
          # __clerk_hs_reason=dev-browser-missing. That still proves
          # /dashboard is auth-protected (not 404, not served open), so the
          # smoke gate accepts it. When test keys are replaced with live keys
          # (Johnny's call), the handshake goes away and the /sign-in branch
          # below is the live assertion again.
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: text/html" "$base/dashboard")
          location=$(curl -s -o /dev/null -w "%{redirect_url}" -H "Accept: text/html" "$base/dashboard")
          echo "GET /dashboard -> $code (redirect target: ${location:-<none>})"
          if [ "$code" = "404" ]; then
            echo "FAIL: signed-out GET /dashboard returned 404 instead of redirecting to sign-in"
            exit 1
          fi
          case "$location" in
            */sign-in*)
              echo "signed-out /dashboard redirects toward /sign-in"
              ;;
            *clerk.accounts.dev*/handshake*|*__clerk_hs_reason=*)
              echo "signed-out /dashboard redirects into Clerk dev handshake (test keys in use; auth middleware engaged)"
              ;;
            *)
              echo "FAIL: expected a redirect toward /sign-in (or the Clerk dev handshake under test keys), got: $code ${location:-<none>}"
              exit 1
              ;;
          esac
