name: cd

# Continuous deployment: master -> Convex production -> Vercel production.
# Triggered only by pushes to master (i.e. after CI passed and code merged).
# Serialized with concurrency so production deploys never overlap.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-convex:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: deploy backend to Convex production
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        working-directory: packages/backend
        run: npx convex deploy

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [deploy-convex]
    steps:
      # Deploy hook bypasses the Hobby "commit author" block: the deploy is
      # triggered by CI, not by a collaborator push.
      - name: trigger Vercel production deploy
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

  smoke:
    runs-on: ubuntu-latest
    needs: [deploy-vercel]
    steps:
      - name: wait for Vercel deploy to go live
        run: sleep 60

      - name: production health check
        run: |
          curl -sf https://contractoros-johnnyc.vercel.app/ > /dev/null
          echo "production homepage reachable"
