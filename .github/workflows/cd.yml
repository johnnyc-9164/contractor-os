name: cd

# Continuous deployment: master -> Convex production -> Vercel production.
# Triggered only by pushes to master (i.e. after CI passed and code merged).
# Serialized with concurrency so production deploys never overlap.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-convex:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: deploy backend to Convex production
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        working-directory: packages/backend
        run: npx convex deploy

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [deploy-convex]
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      # Deploy hook bypasses the Hobby "commit author" block: the deploy is
      # triggered by CI, not by a collaborator push.
      - name: trigger Vercel production deploy
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

  smoke:
    runs-on: ubuntu-latest
    needs: [deploy-vercel]
    steps:
      - name: production health check (poll until live)
        run: |
          for i in $(seq 1 30); do
            if curl -sf https://contractoros-ten.vercel.app/ > /dev/null; then
              echo "production homepage reachable (attempt $i)"
              exit 0
            fi
            echo "attempt $i: not live yet, waiting 20s..."
            sleep 20
          done
          echo "production homepage never became reachable"
          exit 1
      - name: verify deployed commit and Convex health
        run: |
          observed_sha="<unreachable>"
          for i in $(seq 1 30); do
            if response=$(curl -sf https://contractoros-ten.vercel.app/api/health); then
              observed_sha=$(jq -r '.sha // "<missing>"' <<< "$response")
              if [ "$observed_sha" = "$GITHUB_SHA" ]; then
                convex=$(jq -r '.convex // "<missing>"' <<< "$response")
                if [ "$convex" != "ok" ]; then
                  echo "deployed commit $GITHUB_SHA is live, but Convex health is $convex"
                  exit 1
                fi
                echo "deployed commit $GITHUB_SHA is live and Convex is healthy (attempt $i)"
                exit 0
              fi
            fi
            echo "attempt $i: observed SHA $observed_sha, expected $GITHUB_SHA; waiting 20s..."
            sleep 20
          done
          echo "timed out waiting for deployed SHA: observed $observed_sha, expected $GITHUB_SHA"
          exit 1

  deploy-marketing:
    # Independent of the Convex deploy: marketing is a static surface with no backend.
    # Vercel project `contractor-os-marketing` exists (root: apps/marketing, default
    # *.vercel.app domain, no custom domain per MASTER_BRIEF S58; SSO protection off;
    # public env NEXT_PUBLIC_APP_URL=https://contractoros-ten.vercel.app).
    # PENDING: git connection — the ItsHim Vercel team's GitHub integration cannot see
    # johnnyc-9164/contractor-os (repo_not_found), so no deploy hook exists yet.
    # Unblock: install/authorize the Vercel GitHub App on the johnnyc-9164 GitHub
    # account (Johnny's browser action), then connect the repo and create the deploy
    # hook; set repo secret VERCEL_MARKETING_DEPLOY_HOOK_URL + repo variable
    # MARKETING_URL. Until then this job no-ops.
    runs-on: ubuntu-latest
    env:
      VERCEL_MARKETING_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_MARKETING_DEPLOY_HOOK_URL }}
    steps:
      - name: trigger Vercel marketing deploy
        if: ${{ env.VERCEL_MARKETING_DEPLOY_HOOK_URL != '' }}
        run: curl -sf -X POST "${{ secrets.VERCEL_MARKETING_DEPLOY_HOOK_URL }}"

  smoke-marketing:
    runs-on: ubuntu-latest
    needs: [deploy-marketing]
    env:
      MARKETING_URL: ${{ vars.MARKETING_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - name: marketing homepage reachable and free of auth JS
        if: ${{ env.MARKETING_URL != '' }}
        run: |
          for i in $(seq 1 30); do
            if html=$(curl -sf "${{ vars.MARKETING_URL }}/"); then
              echo "marketing homepage reachable (attempt $i)"
              if grep -qiE "clerk|convex" <<< "$html"; then
                echo "FAIL: clerk/convex references found in marketing homepage"
                exit 1
              fi
              echo "no clerk/convex references in marketing homepage"
              exit 0
            fi
            echo "attempt $i: not live yet, waiting 20s..."
            sleep 20
          done
          echo "marketing homepage never became reachable"
          exit 1
      - name: app CTAs resolve (when configured)
        if: ${{ vars.MARKETING_URL != '' && vars.NEXT_PUBLIC_APP_URL != '' }}
        run: |
          html=$(curl -sf "${{ vars.MARKETING_URL }}/")
          if ! grep -qF "${{ vars.NEXT_PUBLIC_APP_URL }}" <<< "$html"; then
            echo "FAIL: NEXT_PUBLIC_APP_URL not found in marketing homepage links"
            exit 1
          fi
          echo "app URL present in marketing CTAs"
