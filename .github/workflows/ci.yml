name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm biome
      - run: pnpm test

      # The production build needs real backend credentials: providers.tsx
      # constructs the Convex client at module scope, which throws during
      # `next build` when NEXT_PUBLIC_CONVEX_URL is empty (pre-existing,
      # unrelated to this PR). Until all three repo secrets exist, this step
      # skips gracefully so lint/type/test stay green. Add them under
      # Settings > Secrets > Actions and the build lights up automatically.
      - name: build (needs repo secrets)
        if: ${{ secrets.NEXT_PUBLIC_CONVEX_URL != '' && secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && secrets.CLERK_SECRET_KEY != '' }}
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
